<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Be My Valentine?</title>
</head>
<body>
    <div id="page1" class="page">
        <h1>Will You Be My Valentine?</h1>
        <img src="https://github.com/Fuelfiery/Valentine-/blob/main/IMG_1331.png?raw=true" alt="Our Photo" class="photo">
        <div class="options">
            <button onclick="handleSelection('yes')">Yes, of course!</button>
            <button onclick="handleSelection('no')">No, I hate you and I don’t love you!</button>
        </div>
    </div>

    <div id="page2" class="page" style="display: none;">
        <h1 id="message"></h1>
        <img src="https://github.com/Fuelfiery/Valentine-/blob/main/hearts.png?raw=true" alt="Our Photo" class="photo">
    </div>

    <script>
        function handleSelection(selection) {
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const message = document.getElementById('message');

            page1.style.display = 'none';
            page2.style.display = 'block';

            if (selection === 'yes') {
                message.textContent = "See you on Saturday, 15th February 2025 at Karura Forest!";
                page2.style.background = "url('heart_background_url_here') no-repeat center center fixed";
                page2.style.backgroundSize = "cover";
            } else {
                message.textContent = "You really hate me, do you? And you don’t love me.";
                page2.style.backgroundColor = "black";
            }
        }
    </script>
</body>
</html>
